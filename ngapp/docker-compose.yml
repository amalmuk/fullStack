
services:
  mongodb:
    image: mongo:8
    container_name: tp3-mongodb
    ports:
      - "27017:27017"
    volumes:
      - tp3-mongo-data:/data/db
    networks:
      - tp3-network

  backend:
    build: ./backend
    container_name: tp3-backend
    ports:
      - "3001:3001"
    env_file:
      - ./backend/.env
    depends_on:
      - mongodb
    networks:
      - tp3-network

volumes:
  tp3-mongo-data:
    external: true
    name: tp3-mongo-data

networks:
  tp3-network:
    driver: bridge
